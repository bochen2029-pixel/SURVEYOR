# SV-032 - the Death Notification Registration (DNR) is due 30 days after the end of
# the month in which the death was reported to the OPO (OPTN Table 18-1). The site
# audits to "month-end following the referral month", which is one day LOOSER than
# the mandate whenever the following month has 31 days - so the L0 letter is what
# the floor grades (S2b reviewer finding); the site paraphrase is noted, not encoded.
id: SV-032
title: DNR due 30 days after the end of the referral month
family: clocks
layer: L0
authority: "OPTN Policy 18 Table 18-1: Death Notification Registration due 30 days after the end of the month in which a donor hospital reports a death to the OPO - pin at rung 05; site month-end rule [H] is a looser paraphrase"
trigger: continuous
anchor: referral.received_ts
anchor_why: "the month in which the hospital reported the death to the OPO - the referral, not the recovery and not case close"
predicate: "within(month_end_of(referral.received_ts), dnr.submitted_ts, 30d)"
action: alarm
message: "DNR for the referral received {referral.received_ts} not submitted within 30 days after the end of that month."
evidence: [referral.received_ts, dnr.submitted_ts]
expires: P2Y
inverse: retire
tests: fixtures/SV-032/

# SV-057 - the flow sheet is continuous: each segment starts one minute after the
# previous one ends, and every vital is filled in - an explicit zero is a value,
# a blank is not.
id: SV-057
title: flow-sheet continuity - segment start equals prior end plus one minute; every vital non-blank including explicit zero
family: sequence
layer: L1
authority: "Quality-science invariant: continuous donor-management documentation (site audit checklist [H]); OPTN Policy 2.13 deceased donor management context - AUTHORITY OUTSIDE THE PINNED CORPUS (AATB and FDA guidance are licensed or non-codified; see crosswalk/pins.py --coverage). Not a promise of a future pin"
trigger: on_close_attempt
predicate: "every_pair(flow_sheet.segments, minutes_between(prev.end_ts, next.start_ts) == 1) and every(flow_sheet.segments, count(vitals) >= flow_sheet.vitals_per_segment and every(vitals, exists(value)))"
action: hold
message: "Flow sheet has a gap or overlap between segments, or a blank vital."
evidence: [flow_sheet.segments]
expires: P1Y
inverse: retire
tests: fixtures/SV-057/

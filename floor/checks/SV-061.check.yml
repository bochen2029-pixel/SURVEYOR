# SV-061 - every injection-site finding is classified medical or non-medical; the
# non-medical ones are eligibility-relevant risk factors.
id: SV-061
title: injection-site findings tagged medical vs non-medical (eligibility-relevant)
family: sequence
layer: L0
authority: "21 CFR 1271.3(o): the physical assessment looks for signs suggestive of risk factors (codified). FDA HCT/P Eligibility guidance item 2 names the risk factor itself - drugs injected for a non-medical reason. PINNED: MAP-SV-005-fda-1271.3 (the assessment), MAP-SV-061-guidance-injected-drugs (the distinction). L1 invariant implementing a guidance-level requirement."
trigger: on_write
predicate: "(count(physical_assessment.injection_sites) > 0 or physical_assessment.injection_sites_assessed == 'yes') and every(physical_assessment.injection_sites, classification == 'medical' or classification == 'non_medical')"
action: hold
message: "An injection-site finding is not classified as medical or non-medical."
evidence: [physical_assessment.injection_sites, physical_assessment.injection_sites_assessed]
expires: P2Y
inverse: retire
tests: fixtures/SV-061/

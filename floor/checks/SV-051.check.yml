# SV-051 - corrections are made the one lawful way: a single line through the
# original, initialed and dated. Deterministic on structured correction records;
# corrections visible only in an image attachment are the assist tier's.
id: SV-051
title: correction method - single line-through, initials, date; no overwrite or white-out
family: sequence
layer: L1
authority: "Quality-science invariant: good documentation practice (AATB records standards; FDA 21 CFR 1271.270 records context); site SOP [H] - pin at rung 05"
trigger: on_close_attempt
predicate: "every(corrections, method == 'single_line_through' and exists(initialed_by) and exists(dated))"
action: flag
message: "A correction was made by a method other than single line-through with initials and date."
evidence: [corrections]
expires: P1Y
inverse: retire
tests: fixtures/SV-051/

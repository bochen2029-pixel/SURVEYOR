# SV-014 - every edit shows who really made it and when. A system property, not a
# chart property: harvested [H] from a real record system that froze attribution to
# the original author, so every later edit looked like the first person's work.
# The check compares the record's editor stamp with the session actor the system
# itself logged; a flag here is a finding about the record system.
id: SV-014
title: true editor and timestamp recorded on every edit (attribution never freezes to the original author)
family: signatures
layer: L1
authority: "Quality-science invariant: audit-trail integrity (site finding [H]); CMS 42 CFR 486 Subpart G and FDA 21 CFR 1271.270 record requirements context - PINNED: MAP-SV-014-fda-1271.270"
trigger: on_write
predicate: "every(edits, exists(editor_id) and exists(ts) and editor_id == session_actor_id)"
action: flag
message: "An edit trail entry is unattributed or attributed to someone other than the logged-in actor (system defect)."
evidence: [edits]
expires: P1Y
inverse: retire
tests: fixtures/SV-014/

# SV-078 - on a case shared with more than one processor, every processor received
# every result. Harvested [H]: cross-processor redistribution is a manual chase today.
id: SV-078
title: cross-processor result redistribution complete on shared cases
family: reconciliation
layer: L1
authority: "Quality-science invariant: result distribution completeness (AATB standards on communication of results context); site practice [H] - AUTHORITY OUTSIDE THE PINNED CORPUS (AATB and FDA guidance are licensed or non-codified; see crosswalk/pins.py --coverage). Not a promise of a future pin"
trigger: on_close_attempt
predicate: "count(shared_case.processors) >= 2 and every(shared_case.processors, subset(shared_case.results, results_received))"
action: hold
message: "A processor on shared case {shared_case.id} has not received every result."
evidence: [shared_case.id, shared_case.results, shared_case.processors]
expires: P1Y
inverse: retire
tests: fixtures/SV-078/

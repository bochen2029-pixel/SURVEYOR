# crosswalk/sources.yml - the sources registry (SPEC section 7).
#
# Each block opens with `id:` at column 0; the rest is flat key: value, the same dialect
# the checks use. THE DOCUMENTS THEMSELVES ARE NOT IN THIS REPOSITORY: they belong to
# their publishers, and this file carries only what makes a copy checkable - the url it
# came from, the sha256 of the extracted text every quote was matched against, its byte
# count, and its effective date. Fetch your own copies, point $SURVEYOR_CORPUS at them,
# and `python crosswalk/pins.py --check` will tell you whether you are reading the same
# bytes every mapping was verified against.
#
# `names` is the pipe-separated list of ways a check's `authority:` string refers to this
# source; the coverage fold uses it to say which checks COULD be pinned and are not yet.
# `cadence` is how often the source is re-fetched to detect an edition change.

